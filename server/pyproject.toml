[project]
name = "me-read-server"
version = "0.1.0"
description = "Local server for me-read: EPUB parsing, speaker tagging and Chatterbox speech"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "mlx-audio==0.5.7",
    "soundfile>=0.13",
    "huggingface_hub>=0.30",
    "lxml>=5",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
